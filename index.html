<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
    let history = []; 
    let pageBreaks = []; 
    let isFirstEntry = true;
    let initialValues = {};
    let tempBonusCalculated = 0; 
    let tempBonusPeriod = "";
    let tempTotalDays = 0;
    let tempSpentDays = 0;
    let tempDutyDays = 0;
    let grandTotalLwpGlobal = 0;

    // Fixation specific global data structure
    let payFixationReportData = null;

    // 7th Pay Matrix Minimum Arrays for Scale Suggestion/Mapping
    const matrix7th = {
        "S-1": 15000, "S-2": 16600, "S-3": 17800, "S-4": 18200, "S-5": 19000,
        "S-6": 19900, "S-7": 21700, "S-8": 25500, "S-9": 29200, "S-10": 29200,
        "S-11": 35400, "S-12": 35400, "S-13": 35400, "S-14": 38600, "S-15": 41800,
        "S-16": 44900, "S-17": 47600, "S-18": 53100, "S-19": 56100, "S-20": 56100,
        "S-21": 67700, "S-22": 67700, "S-23": 67700, "S-24": 78800, "S-25": 78800,
        "S-26": 118500, "S-27": 118500, "S-28": 131100, "S-29": 131100, "S-30": 144200, "S-31": 182200
    };

    const config = { dateFormat: "d/m/Y", allowInput: true };
    
    // जुने कॅलेंडर पिकर्स
    const p3Pick = flatpickr("#p3_date", { ...config, onChange: setFirstStartDate });
    const bPick = flatpickr("#b_end", { ...config, onChange: updateLeaveStartDate });
    const pLeavePick = flatpickr("#p_leave_end", config);
    flatpickr("#bonus_start_date", config);
    flatpickr("#bonus_end_date", config);
    
    const joinPick = flatpickr("#info_join_date", { ...config, onChange: function() { saveEmployeeInfo(); syncJoinDateToMacp(); } });
    const retirePick = flatpickr("#info_retire_date", { ...config, onChange: saveEmployeeInfo });
    const macpJoinPick = flatpickr("#macp_join_date", { ...config, onChange: calculateMacp });
    
    // **दुरुस्ती १: नवीन ५ व्या टॅबमधील कॅलेंडर पिकर्स सक्रिय केले**
    flatpickr("#pf_eff_date", config);
    flatpickr("#pf_option_date", config);
    flatpickr("#pf_end_date", config);

    window.onload = function() {
        if(localStorage.getItem("pmc_leave_history")) {
            history = JSON.parse(localStorage.getItem("pmc_leave_history"));
            isFirstEntry = false;
            initialValues = JSON.parse(localStorage.getItem("pmc_initial_values"));
            if(localStorage.getItem("pmc_page_breaks")) {
                pageBreaks = JSON.parse(localStorage.getItem("pmc_page_breaks"));
            }
            
            document.getElementById('p3_date').value = initialValues.p3;
            document.getElementById('p3_date').disabled = true;
            document.getElementById('z3_bal').value = initialValues.el;
            document.getElementById('z3_bal').disabled = true;
            document.getElementById('aa3_bal').value = initialValues.ml;
            document.getElementById('aa3_bal').disabled = true;
            let lastRecord = history[history.length - 1];
            
            let nextA = lastRecord.type === "bonus" ? lastRecord.nextA : formatDMY(nextDay(parseDMY(lastRecord.p)));
            document.getElementById('a_start').value = nextA;
            document.getElementById('o_leave_start').value = nextA;
            
            document.getElementById('deleteBtn').style.display = "inline-block";
            renderTable();
        }
        if(localStorage.getItem("pmc_emp_info")) {
            let emp = JSON.parse(localStorage.getItem("pmc_emp_info"));
            document.getElementById('info_name').value = emp.name || "";
            document.getElementById('info_desig').value = emp.desig || "";
            document.getElementById('info_dept').value = emp.dept || "";
            document.getElementById('info_pf').value = emp.pf || "";
            if(emp.joinDate) {
                if(joinPick) joinPick.setDate(emp.joinDate);
                if(macpJoinPick) macpJoinPick.setDate(emp.joinDate);
            }
            if(emp.retireDate && retirePick) retirePick.setDate(emp.retireDate);
        }
        if(localStorage.getItem("pmc_calc_pay")) {
            let calc = JSON.parse(localStorage.getItem("pmc_calc_pay"));
            document.getElementById('basic_pay').value = calc.basic || "";
            document.getElementById('da_amount').value = calc.da || "";
            calculateEncashment();
        }
        calculateMacp();
        onPayCommChange(); // ५ व्या टॅबमधील ड्रॉपडाउन लिस्ट लोड करणे
    };

    function parseDMY(str) {
        if(!str) return null;
        let parts = str.split("/");
        return new Date(parts[2], parts[1] - 1, parts[0]);
    }

    function formatDMY(dateObj) {
        if(!dateObj || isNaN(dateObj.getTime())) return "";
        return `${String(dateObj.getDate()).padStart(2,'0')}/${String(dateObj.getMonth()+1).padStart(2,'0')}/${dateObj.getFullYear()}`;
    }

    function nextDay(dateObj) {
        let next = new Date(dateObj);
        next.setDate(next.getDate() + 1);
        return next;
    }

    function syncJoinDateToMacp() {
        let jd = document.getElementById('info_join_date').value;
        if(jd && macpJoinPick) {
            macpJoinPick.setDate(jd);
            calculateMacp();
        }
    }

    function updateLeaveStartDate() {
        let bVal = document.getElementById('b_end').value;
        if(bVal && bVal.trim() !== "" && bVal.trim() !== "---") {
            document.getElementById('o_leave_start').value = formatDMY(nextDay(parseDMY(bVal)));
        } else {
            document.getElementById('o_leave_start').value = document.getElementById('a_start').value;
        }
        validateLwpDatesScope();
    }

    // **दुरुस्ती २: टॅब बदलण्याचे मूळ फंक्शन सुधारले जेणेकरून ५ वा टॅब देखील उघडेल**
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        if (event && event.currentTarget) {
            event.currentTarget.classList.add('active');
        }
        
        if(tabId === 'page2' && history.length > 0) {
            document.getElementById('total_el_shilak').value = Math.floor(history[history.length - 1].finalEL);
            calculateEncashment();
        }
        if(tabId === 'page4') {
            document.getElementById('macp_lwp').value = grandTotalLwpGlobal;
            calculateMacp();
        }
    }

    function setFirstStartDate() {
        if(isFirstEntry && document.getElementById('p3_date').value) {
            let nextA = formatDMY(nextDay(parseDMY(document.getElementById('p3_date').value)));
            document.getElementById('a_start').value = nextA;
            document.getElementById('o_leave_start').value = nextA;
        }
    }

    function toggleLwpPanel() {
        let lwpCount = parseInt(document.getElementById('e_lwp').value) || 0;
        let panel = document.getElementById('lwpPanel');
        if(lwpCount > 0) {
            panel.style.display = "block";
            if(document.getElementById('lwpContainer').children.length === 0) {
                addLwpRow();
            }
        } else {
            panel.style.display = "none";
            document.getElementById('lwpContainer').innerHTML = "";
        }
        checkLwpValidation();
    }

    function addLwpRow() {
        let container = document.getElementById('lwpContainer');
        let index = container.children.length;
        let row = document.createElement('div');
        row.className = 'lwp-row';
        row.id = 'lwp_row_' + index;
        row.innerHTML = `
            <div><label>LWP पासून (From):</label><input type="text" class="lwp-start-pick" placeholder="DD/MM/YYYY" onchange="checkLwpValidation()"></div>
            <div><label>LWP पर्यंत (To):</label><input type="text" class="lwp-end-pick" placeholder="DD/MM/YYYY" onchange="checkLwpValidation()"></div>
            <button class="btn-remove-row" onclick="removeLwpRow(${index})">🗑️</button>
        `;
        container.appendChild(row);
        flatpickr(row.querySelector('.lwp-start-pick'), config);
        flatpickr(row.querySelector('.lwp-end-pick'), config);
        checkLwpValidation();
    }

    function removeLwpRow(index) {
        let row = document.getElementById('lwp_row_' + index);
        if(row) row.remove();
        checkLwpValidation();
    }

    function validateLwpDatesScope() {
        let aStr = document.getElementById('a_start').value;
        let bStr = document.getElementById('b_end').value;
        if(!aStr || !bStr || bStr === "---") return true;
        let aDate = parseDMY(aStr);
        let bDate = parseDMY(bStr);

        let startInputs = document.querySelectorAll('.lwp-start-pick');
        let endInputs = document.querySelectorAll('.lwp-end-pick');
        let inScope = true;

        startInputs.forEach((input, i) => {
            let s = parseDMY(input.value);
            let e = parseDMY(endInputs[i].value);
            if(s && (s < aDate || s > bDate)) inScope = false;
            if(e && (e < aDate || e > bDate)) inScope = false;
        });
        return inScope;
    }

    function checkLwpValidation() {
        let targetLwp = parseInt(document.getElementById('e_lwp').value) || 0;
        let saveBtn = document.getElementById('saveEntryBtn');
        let msgBox = document.getElementById('lwpStatusMsg');
        
        if(targetLwp === 0) {
            saveBtn.disabled = false; saveBtn.style.opacity = "1"; msgBox.innerText = ""; return;
        }

        let startInputs = document.querySelectorAll('.lwp-start-pick');
        let endInputs = document.querySelectorAll('.lwp-end-pick');
        let currentTotal = 0;
        let allFilled = true;

        startInputs.forEach((input, i) => {
            let sStr = input.value; let eStr = endInputs[i].value;
            if(!sStr || !eStr) { allFilled = false; return; }
            let d1 = parseDMY(sStr); let d2 = parseDMY(eStr);
            let diff = Math.round((d2.getTime() - d1.getTime()) / (1000 * 60 * 60 * 24)) + 1;
            currentTotal += diff;
        });

        let scopeValid = validateLwpDatesScope();

        if(!allFilled) {
            saveBtn.disabled = true; saveBtn.style.opacity = "0.5";
            msgBox.innerHTML = "⚠️ कृपया सर्व कॅलेंडरमधील तारखा निवडा."; msgBox.style.color = "#d32f2f";
        } else if(!scopeValid) {
            saveBtn.disabled = true; saveBtn.style.opacity = "0.5";
            msgBox.innerHTML = "❌ बिनपगारी रजेचा कालावधी चालू हजर कालावधीच्या (A ते B) बाहेर जात आहे!"; msgBox.style.color = "#d32f2f";
        } else if(currentTotal !== targetLwp) {
            saveBtn.disabled = true; saveBtn.style.opacity = "0.5";
            msgBox.innerHTML = `⏳ दिवस जुळत नाहीत! मुख्य संख्या: ${targetLwp} दिवस | कॅलेंडर एकूण बेरीज: ${currentTotal} दिवस.`;
            msgBox.style.color = "#e65100";
        } else {
            saveBtn.disabled = false; saveBtn.style.opacity = "1";
            msgBox.innerHTML = "✅ दिवस यशस्वीरित्या जुळले आहेत! नोंद जतन करू शकता."; msgBox.style.color = "#2e7d32";
        }
    }

    function applyLimits(val, maxLimit) {
        return val > maxLimit ? maxLimit : val;
    }

    function addEntry() {
        let a = document.getElementById('a_start').value, b = document.getElementById('b_end').value;
        let o = document.getElementById('o_leave_start').value, p = document.getElementById('p_leave_end').value;
        let q = document.getElementById('q_type').value;
        let e = parseFloat(document.getElementById('e_lwp').value) || 0;

        if (!a || !b || !p) { alert("कृपया सर्व आवश्यक तारखा भरा!"); return; }

        if (isFirstEntry) {
            initialValues = { el: parseFloat(document.getElementById('z3_bal').value) || 0, ml: parseFloat(document.getElementById('aa3_bal').value) || 0, p3: document.getElementById('p3_date').value };
            localStorage.setItem("pmc_initial_values", JSON.stringify(initialValues));
            document.getElementById('p3_date').disabled = true;
            document.getElementById('z3_bal').disabled = true;
            document.getElementById('aa3_bal').disabled = true;
            isFirstEntry = false;
        }

        let curEL = history.length > 0 ? history[history.length-1].finalEL : initialValues.el;
        let curML = history.length > 0 ? history[history.length-1].finalML : initialValues.ml;
        
        let d1 = parseDMY(a); let d2 = parseDMY(b);
        let totalDaysInRange = Math.round((d2.getTime() - d1.getTime()) / (1000 * 60 * 60 * 24)) + 1;
        let f = totalDaysInRange - e; if(f < 0) f = 0;
        
        let g = Math.floor(f / 11) + (f % 11) / 100;
        let h = Math.floor(f / 30) + (f % 30) / 100;
        
        let z3_int = Math.floor(curEL), z3_mod = Math.round((curEL % 1) * 100);
        let g_int = Math.floor(g), g_mod = Math.round((g % 1) * 100);
        let k_val = applyLimits(z3_int + g_int + Math.floor((z3_mod + g_mod)/11) + ((z3_mod + g_mod)%11)/100, 365);

        let aa3_int = Math.floor(curML), aa3_mod = Math.round((curML % 1) * 100);
        let h_int = Math.floor(h), h_mod = Math.round((h % 1) * 100);
        let l_val = applyLimits(aa3_int + h_int + Math.floor((aa3_mod + h_mod)/30) + ((aa3_mod + h_mod)%30)/100, 120);
        
        let do1 = parseDMY(o); let dp1 = parseDMY(p);
        let r_diff = Math.round((dp1.getTime() - do1.getTime()) / (1000 * 60 * 60 * 24)) + 1;

        let finalEL, finalML;
        let k_base = Math.floor(k_val), k_dec = Math.round((k_val % 1) * 100) / 100;
        let l_base = Math.floor(l_val), l_dec = Math.round((l_val % 1) * 100) / 100;

        if (q === "हक्काची रजा") {
            finalEL = (r_diff >= k_base) ? k_dec : (k_base - r_diff + k_dec);
            finalML = l_val;
        } else if (q === "वैद्यकीय रजा") {
            finalEL = applyLimits(Math.max(0, k_base - Math.max(0, r_diff - l_base) + k_dec), 365);
            finalML = (r_diff >= l_base) ? l_dec : (l_base - r_diff + l_dec);
        } else { finalEL = k_val; finalML = l_val; }

        finalEL = applyLimits(finalEL, 365); finalML = applyLimits(finalML, 120);

        let lwpIntervals = [];
        if(e > 0) {
            let startInputs = document.querySelectorAll('.lwp-start-pick');
            let endInputs = document.querySelectorAll('.lwp-end-pick');
            startInputs.forEach((input, i) => {
                lwpIntervals.push({ start: input.value, end: endInputs[i].value });
            });
        }

        history.push({ type: "regular", a, b, e, f, g, h, k_val, l_val, o, p, q, r_diff, finalEL, finalML, lwpIntervals });
        localStorage.setItem("pmc_leave_history", JSON.stringify(history));
        
        renderTable();
        let nextA = formatDMY(nextDay(parseDMY(p)));
        document.getElementById('a_start').value = nextA;
        document.getElementById('o_leave_start').value = nextA;
        document.getElementById('e_lwp').value = "0";
        if(bPick) bPick.clear(); 
        if(pLeavePick) pLeavePick.clear();
        toggleLwpPanel();
    }

    function calculateBonusLeave() {
        let startStr = document.getElementById('bonus_start_date').value;
        let endStr = document.getElementById('bonus_end_date').value;
        if(!startStr || !endStr) { alert("कृपया सुरुवातीचा आणि शेवटचा दिनांक निवडा!"); return; }
        if(history.length === 0) { alert("तक्त्यामध्ये नोंदी असणे आवश्यक आहे!"); return; }

        let dStart = parseDMY(startStr); let dEnd = parseDMY(endStr);
        let totalCalendarDays = Math.round((dEnd.getTime() - dStart.getTime()) / (1000 * 60 * 60 * 24)) + 1;
        let totalR = 0; let totalE = 0;

        history.forEach(item => {
            let itemO = parseDMY(item.o); let itemP = parseDMY(item.p);
            if(itemO >= dStart && itemP <= dEnd) {
                totalR += item.r_diff; totalE += item.e;
            }
        });
        let dutyDays = totalCalendarDays - (totalR + totalE);
        if(dutyDays < 0) dutyDays = 0;
        let rawExtraLeave = (dutyDays * 15) / 365;
        let extraLeaveFloor = Math.floor(rawExtraLeave); 

        tempBonusCalculated = extraLeaveFloor;
        tempBonusPeriod = `${startStr} ते ${endStr}`;
        tempTotalDays = totalCalendarDays; tempSpentDays = totalR; tempDutyDays = dutyDays;

        document.getElementById('bonusResultMsg').innerHTML = `निवडलेल्या अवधीचे एकूण दिवस: ${totalCalendarDays} दिवस<br>सर्व रजा दिवस: ${totalR} दिवस | एकूण LWP: ${totalE} दिवस<br>प्रत्यक्ष कामाचे दिवस (Duty Days): ${dutyDays} दिवस<br>🎯 एकूण पात्र अतिरिक्त रजा (केवळ मुख्य पूर्णांक संख्या): ${extraLeaveFloor} दिवस`;
        document.getElementById('saveBonusBtn').style.display = "inline-block";
    }

    function saveBonusToTable() {
        if(tempBonusCalculated <= 0) return;
        let lastRecord = history[history.length - 1];
        let currentEL = lastRecord.finalEL; let currentML = lastRecord.finalML;
        
        let newEL_int = Math.floor(currentEL), newEL_mod = Math.round((currentEL % 1) * 100);
        let updatedEL = applyLimits(newEL_int + tempBonusCalculated + (newEL_mod / 100), 365);
        let nextStartDateStr = lastRecord.type === "bonus" ? lastRecord.nextA : formatDMY(nextDay(parseDMY(lastRecord.p)));

        history.push({
            type: "bonus", details: `अत्यावश्यक सेवा अतिरिक्त रजा अवधी (${tempBonusPeriod})`, earnedBonus: tempBonusCalculated,
            finalEL: updatedEL, finalML: currentML, nextA: nextStartDateStr,
            bonusStart: tempBonusPeriod.split(" ते ")[0], bonusEnd: tempBonusPeriod.split(" ते ")[1],
            totalDays: tempTotalDays, spentDays: tempSpentDays, dutyDays: tempDutyDays
        });
        localStorage.setItem("pmc_leave_history", JSON.stringify(history));
        renderTable();
        document.getElementById('bonusResultMsg').innerText = "अकलूज/अतिरिक्त रजा यशस्वीरित्या तक्त्यात जमा केली आहे!";
        document.getElementById('saveBonusBtn').style.display = "none";
        tempBonusCalculated = 0;
    }

    function manualPageBreak() {
        if (history.length === 0) { alert("आधी नोंदी जतन करा!"); return; }
        let lastIndex = history.length - 1;
        if (pageBreaks.includes(lastIndex)) { alert("या ओळीवर आधीच पेज ब्रेक केलेला आहे!"); return; }
        if (confirm(`चालू ओळ झाल्यानंतर नवीन पान सुरू करायचे आहे का?`)) {
            pageBreaks.push(lastIndex);
            localStorage.setItem("pmc_page_breaks", JSON.stringify(pageBreaks));
            renderTable();
        }
    }

    function deleteLastEntry() {
        if (history.length === 0) return;
        if (confirm("शेवटची नोंद हटवायची का?")) {
            let lastIndex = history.length - 1; history.pop();
            pageBreaks = pageBreaks.filter(idx => idx !== lastIndex);
            localStorage.setItem("pmc_page_breaks", JSON.stringify(pageBreaks));
            localStorage.setItem("pmc_leave_history", JSON.stringify(history));
            if (history.length === 0) {
                localStorage.clear(); location.reload();
            } else {
                let last = history[history.length - 1];
                let nextA = last.type === "bonus" ? last.nextA : formatDMY(nextDay(parseDMY(last.p)));
                document.getElementById('a_start').value = nextA; document.getElementById('o_leave_start').value = nextA;
                renderTable();
            }
        }
    }

    function clearAllData() {
        if (confirm("सर्व डेटा कायमचा पुसला जाईल. खात्री आहे का?")) { localStorage.clear(); location.reload(); }
    }

    function saveEmployeeInfo() {
        localStorage.setItem("pmc_emp_info", JSON.stringify({
            name: document.getElementById('info_name').value, desig: document.getElementById('info_desig').value,
            dept: document.getElementById('info_dept').value, pf: document.getElementById('info_pf').value,
            joinDate: document.getElementById('info_join_date').value, retireDate: document.getElementById('info_retire_date').value
        }));
    }

    function calculateMacp() {
        let joinStr = document.getElementById('macp_join_date').value;
        let lwpDays = parseInt(document.getElementById('macp_lwp').value) || 0;
        let suspDays = parseInt(document.getElementById('macp_suspension').value) || 0;
        let currentLevel = document.getElementById('macp_current_level').value;
        let resultBox = document.getElementById('macpResult');

        if(!joinStr) {
            resultBox.innerHTML = "⚠️ कृपया आधी कर्मचाऱ्यांची माहिती किंवा प्रथम नियुक्ती दिनांक टाका."; return;
        }

        let joinDate = parseDMY(joinStr);
        let totalPenaltyDays = lwpDays + suspDays;

        let macp1 = new Date(joinDate.getFullYear() + 10, joinDate.getMonth(), joinDate.getDate());
        let macp2 = new Date(joinDate.getFullYear() + 20, joinDate.getMonth(), joinDate.getDate());
        let macp3 = new Date(joinDate.getFullYear() + 30, joinDate.getMonth(), joinDate.getDate());

        if(totalPenaltyDays > 0) {
            macp1.setDate(macp1.getDate() + totalPenaltyDays);
            macp2.setDate(macp2.getDate() + totalPenaltyDays);
            macp3.setDate(macp3.getDate() + totalPenaltyDays);
        }

        let nxt1 = "S-7 (रु. २१७००-६९१००)", nxt2 = "S-9 (रु. २९२००-९२३००)", nxt3 = "S-11 (रु. ३५४००-११२४००)";
        if(currentLevel === "S-8") { nxt1 = "S-10 (रु. २९२००-९२३००)"; nxt2 = "S-13 (रु. ३५४००-११२४००)"; nxt3 = "S-14 (रु. ३८६००-१२२८००)"; }
        if(currentLevel === "S-10") { nxt1 = "S-13 (रु. ३५४००-११२४००)"; nxt2 = "S-14 (रु. ३८६००-१२२८००)"; nxt3 = "S-15 (रु. ४१८४००-१३२३००)"; }

        let crGrades = document.querySelectorAll('.cr-grade');
        let isEligible = true;
        crGrades.forEach(select => {
            if(select.value === "साधारण") isEligible = false;
        });

    function generateLeaveAndLwpReports() {
        let lwpMap = {}; let leaveMap = {}; let grandLwpSum = 0;

        history.forEach(item => {
            if(item.type !== "bonus") {
                if(item.lwpIntervals && item.lwpIntervals.length > 0) {
                    item.lwpIntervals.forEach(interval => {
                        let dStart = parseDMY(interval.start), dEnd = parseDMY(interval.end);
                        if(!dStart || !dEnd) return;
                        
                        let current = new Date(dStart.getFullYear(), dStart.getMonth(), dStart.getDate());
                        let targetEnd = new Date(dEnd.getFullYear(), dEnd.getMonth(), dEnd.getDate());

                        while (current <= targetEnd) {
                            let monthKey = `${String(current.getMonth() + 1).padStart(2, '0')}/${current.getFullYear()}`;
                            let nextMonthFirstDay = new Date(current.getFullYear(), current.getMonth() + 1, 1);
                            let segmentEnd = new Date(nextMonthFirstDay.getTime() - (1000 * 60 * 60 * 24));
                            if (segmentEnd > targetEnd) segmentEnd = new Date(targetEnd.getTime());
                            
                            let segmentDays = Math.round((segmentEnd.getTime() - current.getTime()) / (1000 * 60 * 60 * 24)) + 1;

                            if(!lwpMap[monthKey]) lwpMap[monthKey] = { days: 0, intervals: [] };
                            lwpMap[monthKey].days += segmentDays;
                            lwpMap[monthKey].intervals.push(`${formatDMY(current)} ते ${formatDMY(segmentEnd)} (${segmentDays} दिवस)`);
                            current = nextMonthFirstDay;
                        }
                    });
                }

                let dStart = parseDMY(item.o), dEnd = parseDMY(item.p);
                if(dStart && dEnd) {
                    let current = new Date(dStart.getFullYear(), dStart.getMonth(), dStart.getDate());
                    let targetEnd = new Date(dEnd.getFullYear(), dEnd.getMonth(), dEnd.getDate());

                    while(current <= targetEnd) {
                        let monthKey = `${String(current.getMonth() + 1).padStart(2, '0')}/${current.getFullYear()}`;
                        let nextMonthFirstDay = new Date(current.getFullYear(), current.getMonth() + 1, 1);
                        let segmentEnd = new Date(nextMonthFirstDay.getTime() - (1000 * 60 * 60 * 24));
                        if (segmentEnd > targetEnd) segmentEnd = new Date(targetEnd.getTime());
                        
                        let segmentDays = Math.round((segmentEnd.getTime() - current.getTime()) / (1000 * 60 * 60 * 24)) + 1;

                        if(!leaveMap[monthKey]) {
                            leaveMap[monthKey] = { "हक्काची रजा": 0, "वैद्यकीय रजा": 0, "विशेष रजा": 0, breakups: [] };
                        }
                        if(leaveMap[monthKey][item.q] !== undefined) {
                            leaveMap[monthKey][item.q] += segmentDays;
                        }
                        leaveMap[monthKey].breakups.push(`${item.q}: ${formatDMY(current)} ते ${formatDMY(segmentEnd)} (${segmentDays} दिवस)`);
                        current = nextMonthFirstDay;
                    }
                }
            }
        });

        let lwpTwp = document.querySelector("#lwpMonthlyTable tbody"); lwpTwp.innerHTML = "";
        let sortedLwpMonths = Object.keys(lwpMap).sort((mA, mB) => {
            return new Date(mA.split("/")[1], mA.split("/")[0]-1) - new Date(mB.split("/")[1], mB.split("/")[0]-1);
        });
        
        if(sortedLwpMonths.length === 0) {
            lwpTwp.innerHTML = `<tr><td colspan="3" style="color: #666;">अजून कोणतीही बिनपगारी नोंद नाही.</td></tr>`;
        } else {
            sortedLwpMonths.forEach(month => {
                let mName = new Date(month.split("/")[1], month.split("/")[0]-1).toLocaleString('mr', { month: 'long', year: 'numeric' });
                let row = lwpTwp.insertRow();
                row.innerHTML = `<td><strong>${mName}</strong></td><td style="color:#d32f2f; font-weight:bold;">${lwpMap[month].days} दिवस</td><td style="text-align:left; padding-left:15px;">${lwpMap[month].intervals.join("<br>")}</td>`;
                grandLwpSum += lwpMap[month].days;
            });
            let lwpTotalRow = lwpTwp.insertRow();
            lwpTotalRow.className = "grand-total-row";
            lwpTotalRow.innerHTML = `<td>ग्रँड एकूण संख्या (Grand Total LWP)</td><td style="color:#1b5e20; font-weight:bold;">${grandLwpSum} दिवस</td><td>---</td>`;
        }

        grandTotalLwpGlobal = grandLwpSum;
        document.getElementById('macp_lwp').value = grandLwpSum;

        let leaveTbody = document.querySelector("#allLeavesMonthlyTable tbody"); leaveTbody.innerHTML = "";
        let sortedLeaveMonths = Object.keys(leaveMap).sort((mA, mB) => {
            return new Date(mA.split("/")[1], mA.split("/")[0]-1) - new Date(mB.split("/")[1], mB.split("/")[0]-1);
        });
        
        if(sortedLeaveMonths.length === 0) {
            leaveTbody.innerHTML = `<tr><td colspan="5" style="color: #666;">अजून कोणतीही रजा नोंद नाही.</td></tr>`;
        } else {
            let totalElSum = 0, totalMlSum = 0, totalSplSum = 0; 
            sortedLeaveMonths.forEach(month => {
                let mName = new Date(month.split("/")[1], month.split("/")[0]-1).toLocaleString('mr', { month: 'long', year: 'numeric' });
                let row = leaveTbody.insertRow();
                row.innerHTML = `
                    <td><strong>${mName}</strong></td>
                    <td style="color:#1a73e8; font-weight:bold;">${leaveMap[month]["हक्काची रजा"]} दिवस</td>
                    <td style="color:#e65100; font-weight:bold;">${leaveMap[month]["वैद्यकीय रजा"]} दिवस</td>
                    <td style="color:#00796b; font-weight:bold;">${leaveMap[month]["विशेष रजा"]} दिवस</td>
                    <td style="text-align:left; padding-left:15px; line-height:1.4;">${leaveMap[month].breakups.join("<br>")}</td>
                `;
                totalElSum += leaveMap[month]["हक्काची रजा"]; totalMlSum += leaveMap[month]["वैद्यकीय रजा"]; totalSplSum += leaveMap[month]["विशेष रजा"];
            });
            let leaveTotalRow = leaveTbody.insertRow();
            leaveTotalRow.className = "grand-total-row";
            leaveTotalRow.innerHTML = `
                <td>ग्रँड एकूण संख्या (Grand Total Leaves)</td>
                <td style="color:#1b5e20; font-weight:bold;">${totalElSum} दिवस</td><td style="color:#1b5e20; font-weight:bold;">${totalMlSum} दिवस</td><td style="color:#1b5e20; font-weight:bold;">${totalSplSum} दिवस</td><td>---</td>
            `;
        }
    }

    function processPayFixationAndDiff() {
        let commType = document.getElementById("pf_comm_type").value;
        let currentScale = document.getElementById("pf_current_scale").value;
        let newScale = document.getElementById("pf_new_scale").value;
        let effDateStr = document.getElementById("pf_eff_date").value;
        let basicInput = parseFloat(document.getElementById("pf_basic").value) || 0;
        let optionType = document.getElementById("pf_option_type").value;
        let optDateStr = document.getElementById("pf_option_date").value;
        let endDateStr = document.getElementById("pf_end_date").value;

        if (!effDateStr || basicInput <= 0 || !endDateStr) {
            alert("कृपया अंमलबजावणी तारीख, मूळ वेतन आणि फरक बिलाची शेवटची तारीख अचूक भरा!");
            return;
        }

        let effDate = parseDMY(effDateStr);
        let endDate = parseDMY(endDateStr);
        if (endDate < effDate) {
            alert("शेवटची तारीख अंमलबजावणीच्या तारखेपेक्षा पुढे असणे आवश्यक आहे!");
            return;
        }

        let finalFixationBasic = basicInput;
        let fixationRemarks = "";
        let incrementalBonus = Math.round(basicInput * 0.03); 

        if (optionType === "effective_date") {
            let rawDue = basicInput + incrementalBonus;
            if (commType === "7th") {
                let targetMin = matrix7th[newScale] || 0;
                finalFixationBasic = Math.max(rawDue, targetMin);
                if (finalFixationBasic > targetMin) {
                    finalFixationBasic = Math.ceil(finalFixationBasic / 100) * 100;
                }
            } else {
                finalFixationBasic = rawDue; 
            }
            fixationRemarks = `वरिष्ठ श्रेणी दिनांकास थेट १ काल्पनिक वेतनवाढ (रु. ${incrementalBonus}) जोडून वेतननिश्चिती केली.`;
        } else {
            let dualBonus = Math.round(basicInput * 0.03) + Math.round(basicInput * 0.03); 
            let rawDue = basicInput + dualBonus;
            if (commType === "7th") {
                let targetMin = matrix7th[newScale] || 0;
                finalFixationBasic = Math.max(rawDue, targetMin);
                if (finalFixationBasic > targetMin) {
                    finalFixationBasic = Math.ceil(finalFixationBasic / 100) * 100;
                }
            } else {
                finalFixationBasic = rawDue;
            }
            fixationRemarks = `विकल्प तारखेनुसार वार्षिक वेतनवाढ + वरिष्ठ श्रेणी वेतनवाढ एकत्र (रु. ${dualBonus}) जोडून सुधारित फिक्सिंग केले.`;
        }

        let resBox = document.getElementById("payFixResult");
        resBox.style.display = "block";
        resBox.innerHTML = `
            <strong>🎯 वरिष्ठ श्रेणी वेतननिश्चिती अहवाल निष्कर्ष:</strong><br>
            • निश्चित पे लेव्हल / श्रेणी स्तर: <strong>${commType === '7th' ? newScale : 'GP ' + newScale}</strong><br>
            • सुधारित नवीन मूळ वेतन (Revised Basic): <strong>रु. ${finalFixationBasic} /-</strong><br>
            • अंमलबजावणी/वेतन निश्चिती तारीख: ${optionType === 'increment_date' ? optDateStr : effDateStr}<br>
            • शेरा (Rules applied): ${fixationRemarks}
        `;

        payFixationReportData = {
            commType, currentScale, newScale, effDateStr, basicInput, finalFixationBasic, optionType, fixationRemarks
        };

        let tbody = document.querySelector("#diffTable tbody");
        tbody.innerHTML = "";
        
        let currentDate = new Date(effDate.getFullYear(), effDate.getMonth(), 1);
        let targetEnd = new Date(endDate.getFullYear(), endDate.getMonth(), 1);
        let totalDifferenceSum = 0;

        let fixActiveDate = (optionType === "increment_date" && optDateStr) ? parseDMY(optDateStr) : effDate;

        while (currentDate <= targetEnd) {
            let mName = currentDate.toLocaleString('mr', { month: 'long', year: 'numeric' });
            
            let currentDueBasic = basicInput;
            if (currentDate >= new Date(fixActiveDate.getFullYear(), fixActiveDate.getMonth(), 1)) {
                currentDueBasic = finalFixationBasic;
            }
            let currentDrawnBasic = basicInput;

            let daPercent = getDaRateByDate(currentDate);
            let dueDa = Math.round(currentDueBasic * daPercent);
            let drawnDa = Math.round(currentDrawnBasic * daPercent);

            let dueHra = Math.round(currentDueBasic * getHraRate(currentDueBasic));
            let drawnHra = Math.round(currentDrawnBasic * getHraRate(currentDrawnBasic));

            let totalDue = currentDueBasic + dueDa + dueHra;
            let totalDrawn = currentDrawnBasic + drawnDa + drawnHra;
            let diff = totalDue - totalDrawn;
            totalDifferenceSum += diff;

            let row = tbody.insertRow();
            row.innerHTML = `
                <td><strong>${mName}</strong></td>
                <td style="color: blue;">${currentDueBasic}</td><td>${dueDa}</td><td>${dueHra}</td><td style="font-weight:bold; color:blue;">${totalDue}</td>
                <td>${currentDrawnBasic}</td><td>${drawnDa}</td><td>${drawnHra}</td><td>${totalDrawn}</td>
                <td style="font-weight:bold; color:${diff > 0 ? 'green' : '#333'};">${diff}</td>
            `;

            currentDate.setMonth(currentDate.getMonth() + 1);
        }

        let totalRow = tbody.insertRow();
        totalRow.className = "grand-total-row";
        totalRow.innerHTML = `
            <td>एकूण फरक थकबाकी बेरीज (Grand Total Arrears)</td>
            <td colspan="4">---</td><td colspan="4">---</td>
            <td style="font-size:14px; font-weight:bold; color:#1b5e20;">रु. ${totalDifferenceSum} /-</td>
        `;

        document.getElementById("diffChartHeading").style.display = "block";
        document.getElementById("diffTable").style.display = "table";
        document.getElementById("downloadFixationBtn").style.display = "inline-block";
    }

    function downloadPayFixationCSV() {
        if (!payFixationReportData) return;
        let csvContent = "\uFEFF";
        csvContent += "वरिष्ठ श्रेणी वेतननिश्चिती व फरक बिल अहवाल\n\n";
        csvContent += `वेतन आयोग,${payFixationReportData.commType}\n`;
        csvContent += `जुन्या वेतनश्रेणी,${payFixationReportData.currentScale}\n`;
        csvContent += `नवीन वरिष्ठ श्रेणी,${payFixationReportData.newScale}\n`;
        csvContent += `अंमलबजावणी दिनांक,${payFixationReportData.effDateStr}\n`;
        csvContent += `जुने मूळ वेतन,${payFixationReportData.basicInput}\n`;
        csvContent += `सुधारित मूळ वेतन,${payFixationReportData.finalFixationBasic}\n`;
        csvContent += `लागू नियम व शेरा,${payFixationReportData.fixationRemarks}\n\n`;

        csvContent += "मासिक फरक बिल माहिती,\n";
        csvContent += "महिना,Due Basic,Due DA,Due HRA,Total Due,Drawn Basic,Drawn DA,Drawn HRA,Total Drawn,Monthly Diff\n";

        let rows = document.querySelectorAll("#diffTable tbody tr");
        rows.forEach(r => {
            let cells = Array.from(r.querySelectorAll("td")).map(c => c.innerText.replace("रु. ", "").replace(" /-", "").trim());
            if(cells.length > 0 && !r.classList.contains("grand-total-row")) {
                csvContent += cells.join(",") + "\n";
            }
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.setAttribute("href", URL.createObjectURL(blob));
        link.setAttribute("download", `Pay_Fixation_Arrears_Report.csv`);
        link.click();
    }
</script>
