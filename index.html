<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ड्यू-ड्रॉन मासिक फरक तक्ता प्रणाली</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #1f4e78;
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 3px solid #1f4e78;
            padding-bottom: 10px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
            font-size: 14px;
        }
        input, select {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-calculate {
            grid-column: 1 / -1;
            background-color: #1f4e78;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }
        .btn-calculate:hover {
            background-color: #153552;
        }
        .table-responsive {
            overflow-x: auto;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #cbd5e1;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #d9e1f2;
            color: #000;
            font-weight: bold;
            vertical-align: middle;
        }
        .text-right {
            text-align: right;
        }
        .increment-row {
            background-color: #e2efda !important;
            font-weight: bold;
        }
        .total-row {
            background-color: #fff2cc;
            font-weight: bold;
            font-size: 14px;
        }
        .zebra:nth-child(even) {
            background-color: #f9fbfd;
        }
        .badge-inc {
            color: #2e7d32;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>वरिष्ठ श्रेणी वेतननिश्चिती व ड्यू-ड्रॉन मासिक फरक तक्ता</h2>
    
    <div class="form-grid">
        <div class="form-group">
            <label>कर्मचाऱ्याचे नाव:</label>
            <input type="text" id="emp_name" value="राजेश कुलकर्णी">
        </div>
        <div class="form-group">
            <label>अंमलबजावणी दिनांक (Effective Date):</label>
            <input type="date" id="effective_date" value="2026-01-01">
        </div>
        <div class="form-group">
            <label>वार्षिक वेतनवाढ तारीख (Option):</label>
            <select id="inc_month">
                <option value="7">१ जुलै</option>
                <option value="1">१ जानेवारी</option>
            </select>
        </div>
        <div class="form-group">
            <label>ओढलेले पे लेव्हल (Drawn Level):</label>
            <input type="text" id="drawn_level" value="S-13">
        </div>
        <div class="form-group">
            <label>ओढलेले मूळ वेतन (Drawn Basic):</label>
            <input type="number" id="drawn_basic" value="46200">
        </div>
        <div class="form-group">
            <label>देय पे लेव्हल (Due Level):</label>
            <input type="text" id="due_level" value="S-14">
        </div>
        <div class="form-group">
            <label>देय मूळ वेतन (Due Basic):</label>
            <input type="number" id="due_basic" value="47600">
        </div>
        <div class="form-group">
            <label>महागाई भत्ता दर (DA %):</label>
            <input type="number" id="da_rate" value="52" placeholder="उदा. 52">
        </div>
        
        <button class="btn-calculate" onclick="generateDueDrawnTable()">मासिक फरक तक्ता तयार करा</button>
    </div>

    <div class="table-responsive" id="table_container" style="display:none;">
        <table id="due_drawn_table">
            <thead>
                <tr>
                    <th rowspan="2">महिना / वर्ष</th>
                    <th colspan="4">देय (Due)</th>
                    <th colspan="4">ओढलेले (Drawn)</th>
                    <th colspan="3">मासिक फरक (Difference)</th>
                    <th rowspan="2">शेरा</th>
                </tr>
                <tr>
                    <th>पे लेव्हल</th>
                    <th>मूळ वेतन</th>
                    <th>महागाई भत्ता</th>
                    <th>एकूण देय</th>
                    <th>पे लेव्हल</th>
                    <th>मूळ वेतन</th>
                    <th>महागाई भत्ता</th>
                    <th>एकूण ओढलेले</th>
                    <th>मूळ वेतन</th>
                    <th>महागाई भत्ता</th>
                    <th>एकूण फरक</th>
                </tr>
            </thead>
            <tbody id="table_body">
                </tbody>
        </table>
    </div>
</div>

<script>
    function generateDueDrawnTable() {
        // इनपुट व्हॅल्यूज मिळवणे
        const empName = document.getElementById('emp_name').value;
        const effDateVal = document.getElementById('effective_date').value;
        const incMonth = parseInt(document.getElementById('inc_month').value);
        const drawnLevel = document.getElementById('drawn_level').value;
        let drawnBasic = parseFloat(document.getElementById('drawn_basic').value);
        const dueLevel = document.getElementById('due_level').value;
        let dueBasic = parseFloat(document.getElementById('due_basic').value);
        const daPercent = parseFloat(document.getElementById('da_rate').value) / 100;

        if (!effDateVal || isNaN(drawnBasic) || isNaN(dueBasic)) {
            alert("कृपया सर्व माहिती अचूक भरा!");
            return;
        }

        const tableBody = document.getElementById('table_body');
        tableBody.innerHTML = ""; // जुना डेटा क्लिअर करणे
        
        let currentDate = new Date(effDateVal);
        let totalBasicDiff = 0, totalDaDiff = 0, totalNetDiff = 0;
        
        // पुढील २४ महिन्यांचे टप्पे तयार करणे
        for (let i = 0; i < 24; i++) {
            let currentMonth = currentDate.getMonth() + 1; // JS मध्ये महिने 0-11 असतात
            let isIncrementMonth = (currentMonth === incMonth && i > 0);
            let remark = "";
            let rowClass = "zebra";

            // निवडलेल्या वेतनवाढ तारखेनुसार ३% टप्पा वाढवणे (राउंड अप नियम)
            if (isIncrementMonth) {
                dueBasic = Math.ceil((dueBasic * 1.03) / 100) * 100;
                drawnBasic = Math.ceil((drawnBasic * 1.03) / 100) * 100;
                remark = "<span class='badge-inc'>वार्षिक वेतनवाढ</span>";
                rowClass = "increment-row";
            }

            // गणिते (Calculations)
            let dueDa = Math.round(dueBasic * daPercent);
            let totalDue = dueBasic + dueDa;
            
            let drawnDa = Math.round(drawnBasic * daPercent);
            let totalDrawn = drawnBasic + drawnDa;

            let diffBasic = dueBasic - drawnBasic;
            let diffDa = dueDa - drawnDa;
            let diffTotal = totalDue - totalDrawn;

            // बेरीज (Totals)
            totalBasicDiff += diffBasic;
            totalDaDiff += diffDa;
            totalNetDiff += diffTotal;

            // रो (Row) तयार करणे
            let monthYearStr = currentDate.toLocaleString('mr-IN', { month: 'long', year: 'numeric' });
            
            let rowHtml = `<tr class="${rowClass}">
                <td>${monthYearStr}</td>
                <td>${dueLevel}</td>
                <td class="text-right">${dueBasic}</td>
                <td class="text-right">${dueDa}</td>
                <td class="text-right">${totalDue}</td>
                <td>${drawnLevel}</td>
                <td class="text-right">${drawnBasic}</td>
                <td class="text-right">${drawnDa}</td>
                <td class="text-right">${totalDrawn}</td>
                <td class="text-right">${diffBasic}</td>
                <td class="text-right">${diffDa}</td>
                <td class="text-right"><strong>${diffTotal}</strong></td>
                <td>${remark}</td>
            </tr>`;
            
            tableBody.innerHTML += rowHtml;

            // पुढील महिन्याकडे जाणे
            currentDate.setMonth(currentDate.getMonth() + 1);
        }

        // एकूण फरकाची अंतिम ओळ (Total Row)
        let totalHtml = `<tr class="total-row">
            <td colspan="9" class="text-right">एकूण फरक (Total):</td>
            <td class="text-right">${totalBasicDiff}</td>
            <td class="text-right">${totalDaDiff}</td>
            <td class="text-right" style="border: 2px solid #000;">${totalNetDiff}</td>
            <td>---</td>
        </tr>`;
        
        tableBody.innerHTML += totalHtml;
        document.getElementById('table_container').style.display = 'block';
    }
</script>

</body>
</html>
