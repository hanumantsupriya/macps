function parseDMY(str) { if(!str) return null; let parts = str.split("/"); return new Date(parts[2], parts[1] - 1, parts[0]); }
function formatDMY(dateObj) { if(!dateObj || isNaN(dateObj.getTime())) return ""; return `${String(dateObj.getDate()).padStart(2,'0')}/${String(dateObj.getMonth()+1).padStart(2,'0')}/${dateObj.getFullYear()}`; }

}

function getHistoricalDARate(dateObj) {
    let year = dateObj.getFullYear(); let month = dateObj.getMonth() + 1;
    if (year <= 2019) return 0.12; if (year === 2020) return 0.17;
    if (year === 2021) return (month >= 7) ? 0.31 : 0.17;
    if (year === 2022) return (month >= 7) ? 0.38 : 0.34;
    if (year === 2023) return (month >= 7) ? 0.46 : 0.42;
    if (year === 2024) return (month >= 7) ? 0.50 : 0.50;
    if (year === 2025) return (month >= 7) ? 0.58 : 0.55;
    if (year >= 2026) return (month >= 1) ? 0.60 : 0.58; 
    return 0.50;
}

function getHistoricalHRARate(dateObj) {
    if (getHistoricalDARate(dateObj) >= 0.50) return 0.30;
    if (dateObj.getFullYear() >= 2021) return 0.27;
    return 0.24;
}

function calculateAutomaticFixationDiff() {
    let drawnLevel = document.getElementById('fix_drawn_level').value;
    let dueLevel = document.getElementById('fix_due_level').value;
    let drawnBasicStart = parseInt(document.getElementById('fix_drawn_basic').value) || 0;
    let startStr = document.getElementById('fix_start_date').value;
    let endStr = document.getElementById('fix_end_date').value;

    if (!startStr || !endStr || drawnBasicStart <= 0) { alert("कृपया सर्व माहिती अचूक भरा!"); return; }
    let dStart = parseDMY(startStr); let dEnd = parseDMY(endStr); if (dEnd < dStart) { alert("अखेर दिनांक चुकीचा आहे!"); return; }

    let targetDrawnMatrix = payMatrix[drawnLevel];
    let drawnIdx = targetDrawnMatrix.indexOf(drawnBasicStart);
    if(drawnIdx === -1) {
        let approx = targetDrawnMatrix.find(amt => amt >= drawnBasicStart);
        drawnIdx = approx ? targetDrawnMatrix.indexOf(approx) : 0;
    }

    let targetMatrix = payMatrix[dueLevel];
    let nextStageBasic = targetMatrix.find(amt => amt >= drawnBasicStart);
    if (!nextStageBasic) nextStageBasic = targetMatrix[targetMatrix.length - 1];
    let nextStageIndex = targetMatrix.indexOf(nextStageBasic);

    let startMonth = dStart.getMonth() + 1;
    let bonusIncrements = (startMonth >= 1 && startMonth <= 6) ? 1 : 2;
    let finalDueIndex = nextStageIndex + bonusIncrements; if (finalDueIndex >= targetMatrix.length) finalDueIndex = targetMatrix.length - 1;
    let dueBasicStart = targetMatrix[finalDueIndex];

    let ruleText = (startMonth >= 1 && startMonth <= 6) ? 
        `💡 लाभ कालावधी <strong>१ जानेवारी ते ३० जून</strong> च्या दरम्यान असल्यामुळे, लगतच्या टप्प्यावरून <strong>१ अतिरिक्त वेतनवाढ (1 Increment)</strong> दिली आहे.` :
        `💡 लाभ कालावधी <strong>१ जुलै ते ३१ डिसेंबर</strong> च्या दरम्यान असल्यामुळे, लगतच्या टप्प्यावरून <strong>२ अतिरिक्त वेतनवाढी (2 Increments)</strong> दिल्या आहेत.`;

    let formattedMsg = `<strong>वेतननिश्चिती अहवाल:</strong><br>${ruleText}<br>• सुरवातीचे मूळ वेतन: रु. ${drawnBasicStart} (${drawnLevel})<br>• वरिष्ठ सुधारित निश्चित मूळ वेतन: <strong>रु. ${dueBasicStart} (${dueLevel})</strong>`;
    document.getElementById('fixationRuleMsg').style.display = "block"; document.getElementById('fixationRuleMsg').innerHTML = formattedMsg;
    localStorage.setItem("pmc_fixation_msg", formattedMsg);

    calculatedStatements = [];
    let currentCursor = new Date(dStart.getFullYear(), dStart.getMonth(), 1);
    let endCursor = new Date(dEnd.getFullYear(), dEnd.getMonth(), 1);

    let activeDrawnBasic = drawnBasicStart; let activeDueBasic = dueBasicStart;
    let incrementMonth = (startMonth >= 1 && startMonth <= 6) ? 1 : 7;

    while (currentCursor <= endCursor) {
        let curYear = currentCursor.getFullYear(); let curMonth = currentCursor.getMonth() + 1;
        let daysInMonth = new Date(curYear, curMonth, 0).getDate();
        let mLabel = currentCursor.toLocaleString('en-US', { month: 'short', year: '2-digit' }).toUpperCase();

        if (currentCursor.getTime() > dStart.getTime() && curMonth === incrementMonth) {
            let drIdx = payMatrix[drawnLevel].indexOf(activeDrawnBasic); if(drIdx !== -1 && drIdx < payMatrix[drawnLevel].length - 1) activeDrawnBasic = payMatrix[drawnLevel][drIdx + 1];
            let duIdx = payMatrix[dueLevel].indexOf(activeDueBasic); if(duIdx !== -1 && duIdx < payMatrix[dueLevel].length - 1) activeDueBasic = payMatrix[dueLevel][duIdx + 1];
        }

        let lwpDays = getLwpDaysForMonth(curYear, curMonth); let presentDays = daysInMonth - lwpDays;

        let drBasicActual = Math.round((activeDrawnBasic / daysInMonth) * presentDays);
        let duBasicActual = Math.round((activeDueBasic / daysInMonth) * presentDays);

        let daRate = getHistoricalDARate(currentCursor); let hraRate = getHistoricalHRARate(currentCursor);

        // DUE गणना
        let duDa = Math.round(duBasicActual * daRate); let duHra = Math.round(duBasicActual * hraRate);
        let duCps = Math.round((duBasicActual + duDa) * 0.10);
        let duChs = (curYear === 2020 && (curMonth === 5 || curMonth === 6 || curMonth === 7)) ? 0 : Math.round((duBasicActual + duDa) * 0.01);
        let duTotal = duBasicActual + duDa + duHra; // ग्रॉस

        // DRAWN गणना
        let drDa = Math.round(drBasicActual * daRate); let drHra = Math.round(drBasicActual * hraRate);
        let drCps = Math.round((drBasicActual + drDa) * 0.10);
        let drChs = (curYear === 2020 && (curMonth === 5 || curMonth === 6 || curMonth === 7)) ? 0 : Math.round((drBasicActual + drDa) * 0.01);
        let drTotal = drBasicActual + drDa + drHra;

        // DIFFERENCE (फरक विभाग)
        let diffBasic = duBasicActual - drBasicActual; 
        let diffDa = duDa - drDa; 
        let diffHra = duHra - drHra; 
        let diffCps = duCps - drCps; 
        let diffChs = duChs - drChs; 
        
        // 🌟 अचूक मनपा नियमांचे सूत्र: (भत्त्यांची बेरीज) वजा (कपातींची बेरीज)
        let diffTotal = (diffBasic + diffDa + diffHra) - (diffCps + diffChs);

        calculatedStatements.push({ month: mLabel, actualDays: daysInMonth, presentDays, daRateDisplay: (daRate * 100).toFixed(0) + "%", drBasic: drBasicActual, drDa, drHra, drCps, drChs, drTotal, duBasic: duBasicActual, duDa, duHra, duCps, duChs, duTotal, diffBasic, diffDa, diffHra, diffCps, diffChs, diffTotal });
        currentCursor.setMonth(currentCursor.getMonth() + 1);
    }
    localStorage.setItem("pmc_automatic_statements", JSON.stringify(calculatedStatements)); renderStatementTable();
}

function renderStatementTable() {
    let tbody = document.querySelector("#fixationStatementTable tbody"); tbody.innerHTML = "";
    if (calculatedStatements.length === 0) { tbody.innerHTML = `<tr><td colspan="22" style="color: #666; text-align: center;">अजून कोणतीही गणना केलेली नाही.</td></tr>`; return; }

    let tDuB=0, tDuD=0, tDuH=0, tDuC=0, tDuChs=0, tDuT=0; 
    let tDrB=0, tDrD=0, tDrH=0, tDrC=0, tDrChs=0, tDrT=0; 
    let tDiB=0, tDiD=0, tDiH=0, tDiC=0, tDiChs=0, tDiT=0;

    calculatedStatements.forEach(item => {
        let row = tbody.insertRow();
        row.innerHTML = `
            <td><strong>${item.month}</strong></td><td>${item.actualDays}</td><td>${item.presentDays}</td><td>${item.daRateDisplay}</td>
            <td>${item.duBasic}</td><td>${item.duDa}</td><td>${item.duHra}</td><td>${item.duCps}</td><td>${item.duChs}</td><td style="background:#e8f5e9;">${item.duTotal}</td>
            <td>${item.drBasic}</td><td>${item.drDa}</td><td>${item.drHra}</td><td>${item.drCps}</td><td>${item.drChs}</td><td style="background:#f5f5f5;">${item.drTotal}</td>
            <td style="color:blue; font-weight:bold;">${item.diffBasic}</td><td style="color:blue; font-weight:bold;">${item.diffDa}</td><td style="color:blue; font-weight:bold;">${item.diffHra}</td><td style="color:red;">${item.diffCps}</td><td style="color:red;">${item.diffChs}</td>
            <td style="font-weight:bold; background:#e1bee7; color:#4a148c;">${item.diffTotal}</td>
        `;
        tDuB+=item.duBasic; tDuD+=item.duDa; tDuH+=item.duHra; tDuC+=item.duCps; tDuChs+=item.duChs; tDuT+=item.duTotal;
        tDrB+=item.drBasic; tDrD+=item.drDa; tDrH+=item.drHra; tDrC+=item.drCps; tDrChs+=item.drChs; tDrT+=item.drTotal;
        tDiB+=item.diffBasic; tDiD+=item.diffDa; tDiH+=item.diffHra; tDiC+=item.diffCps; tDiChs+=item.diffChs; tDiT+=item.diffTotal;
    });

    let gRow = tbody.insertRow(); gRow.className = "grand-total-row";
    gRow.innerHTML = `
        <td colspan="4"><strong>Grand Total</strong></td>
        <td><strong>${tDuB}</strong></td><td><strong>${tDuD}</strong></td><td><strong>${tDuH}</strong></td><td><strong>${tDuC}</strong></td><td><strong>${tDuChs}</strong></td><td style="background:#c8e6c9;"><strong>${tDuT}</strong></td>
        <td><strong>${tDrB}</strong></td><td><strong>${tDrD}</strong></td><td><strong>${tDrH}</strong></td><td><strong>${tDrC}</strong></td><td><strong>${tDrChs}</strong></td><td style="background:#e0e0e0;"><strong>${tDrT}</strong></td>
        <td style="color:blue;"><strong>${tDiB}</strong></td><td style="color:blue;"><strong>${tDiD}</strong></td><td style="color:blue;"><strong>${tDiH}</strong></td><td style="color:red;"><strong>${tDiC}</strong></td><td style="color:red;"><strong>${tDiChs}</strong></td>
        <td style="font-weight:bold; background:#b39ddb; color:#4a148c; font-size:12px;">रु. ${tDiT}/-</td>
    `;
}

function downloadFixationStatementExcel() {
    if (calculatedStatements.length === 0) return; let csvContent = "\uFEFF";
    csvContent += "Month,Actual Days,Present Days,D. A. %,Due Basic,Due D.A.,Due H.R.A.,Due CPS,Due CHS,Due Total,Drawn Basic,Drawn D.A.,Drawn H.R.A.,Drawn CPS,Drawn CHS,Drawn Total,Diff Basic,Diff D.A.,Diff H.R.A.,Diff CPS,Diff CHS,Diff Total\n";
    calculatedStatements.forEach(item => { csvContent += [item.month, item.actualDays, item.presentDays, item.daRateDisplay, item.duBasic, item.duDa, item.duHra, item.duCps, item.duChs, item.duTotal, item.drBasic, item.drDa, item.drHra, item.drCps, item.drChs, item.drTotal, item.diffBasic, item.diffDa, item.diffHra, item.diffCps, item.diffChs, item.diffTotal].join(",") + "\n"; });
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a"); link.setAttribute("href", URL.createObjectURL(blob)); link.setAttribute("download", "PMC_Fixation_Verified_Diff_Bill.csv"); link.click();
}

function clearFixationStatement() { calculatedStatements = []; localStorage.removeItem("pmc_automatic_statements"); localStorage.removeItem("pmc_fixation_msg"); document.getElementById('fixationRuleMsg').style.display = "none"; renderStatementTable(); }
function calculateEncashment() {} function clearAllData() { localStorage.clear(); location.reload(); } function calculateMacp() {} function saveEmployeeInfo() {} function downloadExcel() {}
</script>
